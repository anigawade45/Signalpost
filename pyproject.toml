[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalpost"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "beautifulsoup4>=4.14,<5",
  "extruct>=0.18,<1",
  "lxml>=6,<7",
  "httpx>=0.27,<1",
  "pydantic>=2.12,<3",
  "pypdf>=6,<7",
  "pytest>=8.0,<9",
  "tldextract>=5.3,<6",
  "trafilatura>=2.0,<3",
]

[project.optional-dependencies]
crawler = [
  "scrapy>=2.13,<3",
  "scrapy-playwright>=0.0.44,<1",
]
sentiment = [
  "accelerate>=1.10,<2",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--ignore=tests/test_poc.py"
markers = [
  "live: marks tests requiring live external network access to Brønnøysund API",
]



[tool.uv]
package = false

